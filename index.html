t:`Wer schläft, sündigt nicht. Er schnarcht nur.`},{id:`w_bremst`,text:`Wer bremst, verliert. Wer nicht bremst, auch. Nur später.`},{id:`w_probieren`,text:`Probieren geht über Studieren. Meistens.`},{id:`w_vorrat`,text:`Vorrat ist der beste Rat. Er widerspricht wenigstens nicht.`},{id:`w_kleider`,text:`Kleider machen Leute. Schuhe machen Tempo.`},{id:`w_ordnung`,text:`Ordnung ist das halbe Leben. Ich wohne in der anderen.`},{id:`w_kopf`,text:`Was man nicht im Kopf hat, muss man nicht tragen.`},{id:`w_junge`,text:`Iss, Junge, du musst noch wachsen.`},{id:`w_reden`,text:`Reden ist Silber. Schweigen ist Feierabend.`},{id:`w_scherben`,text:`Scherben bringen Glück. Man muss sie nur behalten.`},{id:`w_alt`,text:`Man ist so alt, wie man sich fühlt. Heute: hundertvier.`},{id:`w_trinken`,text:`Viel trinken, sagt der Doktor. Was, sagt er nicht.`},{id:`w_weg`,text:`Der Weg ist das Ziel. Sagt der, der sich verlaufen hat.`},{id:`w_gaul`,text:`Einem geschenkten Gaul guckt man nicht aufs Preisschild.`},{id:`w_sport`,text:`Sport ist Mord. Und ich bin unschuldig.`},{id:`w_regen`,text:`Regen macht schön. Man sieht’s nur nicht sofort.`},{id:`w_katze`,text:`Die Katze lässt das Mausen nicht. Der Kater erst recht.`},{id:`w_schreibt`,text:`Wer schreibt, der bleibt. Vor allem sitzen.`},{id:`w_kluegere`,text:`Der Klügere gibt nach. Ich bin leider nicht so klug.`},{id:`w_vogel`,text:`Der frühe Vogel kann mich mal.`},{id:`w_mutt`,text:`Wat mutt, dat mutt.`},{id:`w_moin`,text:`Moin sagt man einmal. Moin moin ist schon Gesabbel.`},{id:`w_sturm`,text:`Sturm ist erst, wenn die Schafe keine Locken mehr haben.`},{id:`w_fisch`,text:`Fischbrötchen ist auch Salat. Liegt ja ein Blatt drin.`}],qh={openers:[`Wir müssen reden.`,`Denny. Hast du kurz Zeit? Das war keine Frage.`,`Ach, da ist er ja. Mit leeren Händen.`,`Schatz? Setz dich mal.`,`Na, auf der Flucht? Komm mal her.`,`Ich hab da mal eine Frage, Denny.`],parcelOpeners:[`Was ist das für ein Karton, Denny?`,`Ein Paket. Für dich. Schon wieder.`,`Der Karton hat verdächtig die Form eines Drachen.`,`Stopp. Karton abstellen. Hände hoch.`,`Sag jetzt bitte nicht: „Das ist für die Arbeit.“`,`Neutral verpackt, ja? Mich täuschst du nicht.`],lines:[{id:`mina_nichts`,line:`Ich war am Geldautomaten. Auf dem Konto ist nichts, Denny. Nichts!`,wisdom:`w_nichts`,concede:`Reichlich nichts. Na, dann sind wir ja reich.`,rebuttal:`Schön. Und wovon zahlen wir die Miete? Von Drachen?`},{id:`mina_licht`,line:`Es ist helllichter Tag, und hier brennen elf Lampen. Elf!`,wisdom:`w_licht`,concede:`Dein Zeh hat mehr Glück als Verstand.`,rebuttal:`Die Stromrechnung geht diesmal an dich.`},{id:`mina_uhr`,line:`Guck mal auf die Uhr! Du wolltest um sechs zu Hause sein!`,wisdom:`w_uhr`,concede:`Das ist so dumm, dass es fast stimmt.`,rebuttal:`Das Essen ist kalt. Mein Blick auch.`},{id:`mina_hoeren`,line:`Hallo? Erde an Denny! Hörst du mir überhaupt zu?`,wisdom:`w_hoeren`,concede:`Frech. Aber gut. Aber frech.`,rebuttal:`Also nein. Dann fang ich noch mal von vorne an.`},{id:`mina_gesicht`,line:`Mein teures Shampoo ist leer. Wofür?! Wo hast du denn bitte Haare?`,wisdom:`w_gesicht`,concede:`Stimmt. Bei dir hat es wirklich sehr viel Platz.`,rebuttal:`Eine Glatze wäscht man mit dem Waschlappen, Denny.`},{id:`mina_bauer`,line:`Pizza Hawaii, Pizza Hawaii! Kennst du überhaupt irgendwas anderes?`,wisdom:`w_bauer`,concede:`Der Bauer kennt genau ein Gericht. Respekt.`,rebuttal:`Auf der Karte stehen über vierzig Pizzen!`},{id:`mina_steht`,line:`Der Weihnachtsbaum steht immer noch im Wohnzimmer. Wie lange soll der noch stehen?`,wisdom:`w_steht`,concede:`Dann stell ich dich mal dazu. Probehalber.`,rebuttal:`Der hat keine einzige Nadel mehr. Ihr seht euch ähnlich.`},{id:`mina_uebrig`,line:`Du sagst, das Regal ist fertig. Und warum sind dann sechs Schrauben übrig?`,wisdom:`w_uebrig`,concede:`Das erklärst du dem Regal, wenn es umfällt.`,rebuttal:`Die gehören IN das Regal, Denny!`},{id:`mina_abstauben`,line:`Du verheimlichst mir doch was. Was weiß ich schon wieder nicht?`,wisdom:`w_abstauben`,concede:`Das ... ist leider ein Argument.`,rebuttal:`Ich weiß es längst. Es hat Flügel und einen Stecker.`},{id:`mina_lohn`,line:`Zwölf Überstunden diese Woche! Hat sich wenigstens mal einer bedankt?`,wisdom:`w_lohn`,concede:`Brutto! Ich lach mich arm.`,rebuttal:`Von Applaus wird der Kühlschrank nicht voll.`},{id:`mina_schlaeft`,line:`Du bist beim Tatort eingeschlafen. Nach vier Minuten!`,wisdom:`w_schlaeft`,concede:`Du hast sogar den Mörder übertönt.`,rebuttal:`Dann erzähl ich dir jetzt die Handlung. Komplett.`},{id:`mina_bremst`,line:`Hier ist dreißig, Schumi! Und das da eben war ein Blitzer!`,wisdom:`w_bremst`,concede:`Später reicht mir. Fahr rechts ran, ich muss lachen.`,rebuttal:`Das Blitzerfoto häng ich neben deine Drachen.`},{id:`mina_probieren`,line:`Da stand groß „Kann Erdnüsse enthalten“ drauf. Liest du so was nicht?`,wisdom:`w_probieren`,concede:`„Meistens.“ Sagt der Mann mit dem Ballonkopf.`,rebuttal:`Wozu hast du das Shirt mit den Bildchen, Denny?`},{id:`mina_vorrat`,line:`Neun Packungen Lebkuchen. Im August! Was willst du mit so einem Vorrat?`,wisdom:`w_vorrat`,concede:`Gut. Aber ich weiß jetzt, wo er liegt.`,rebuttal:`Haltbar bis vorletztes Weihnachten. Ich kann lesen, Denny.`},{id:`mina_kleider`,line:`Blaue Turnschuhe zum Anzug? Wir gehen in die Oper!`,wisdom:`w_kleider`,concede:`Dann sei wenigstens als Erster an der Garderobe.`,rebuttal:`Du siehst aus wie ein Bankberater auf der Flucht.`},{id:`mina_ordnung`,line:`Deine Socken liegen überall. Nur nicht im Wäschekorb!`,wisdom:`w_ordnung`,concede:`Dann zahlst du da drüben aber auch Miete.`,rebuttal:`Eine lag im Brotkasten, Denny. Im Brotkasten.`},{id:`mina_kopf`,line:`Milch, Eier, Brot! Drei Sachen, Denny! Wo hast du nur deinen Kopf?`,wisdom:`w_kopf`,concede:`Dann trägst du ja nie besonders schwer.`,rebuttal:`Aber den Lampenprospekt, den hast du mitgebracht.`},{id:`mina_junge`,line:`Das Brötchen ist so groß wie ein Lenkrad. Das schaffst du nie!`,wisdom:`w_junge`,concede:`Na dann: Mund auf, Augen zu, guten Appetit.`,rebuttal:`Du wächst seit Jahren nur noch zur Seite.`},{id:`mina_reden`,line:`Seit einer Stunde schweigst du mich an. Red doch mal mit mir!`,wisdom:`w_reden`,concede:`Okay, okay. Feierabend. Zehn Minuten.`,rebuttal:`Aha. Mit Herrn Schlurf quatschst du die ganze Nacht!`},{id:`mina_scherben`,line:`Die Lampe liegt in Scherben, Denny. In Scherben! Die fliegt raus!`,wisdom:`w_scherben`,concede:`Na gut. Aber die Scherben saugst DU weg.`,rebuttal:`„Drache, defekt, an Bastler.“ Ist schon online.`},{id:`mina_alt`,line:`Du ächzt beim Aufstehen vom Sofa wie ein alter Mann!`,wisdom:`w_alt`,concede:`Für hundertvier hast du dich gut gehalten.`,rebuttal:`Dann beweg dich mal. Das hält jung.`},{id:`mina_trinken`,line:`Das ist deine fünfte Cola Light heute. Die fünfte!`,wisdom:`w_trinken`,concede:`Ich ruf den Doktor an. Der soll das präzisieren.`,rebuttal:`Er meint Wasser, Denny. Er meint immer Wasser.`},{id:`mina_weg`,line:`Wir laufen seit einer Stunde im Kreis. Frag doch endlich jemanden!`,wisdom:`w_weg`,concede:`Wenigstens gibst du’s zu. Links oder rechts?`,rebuttal:`An dem Brunnen waren wir schon dreimal!`},{id:`mina_gaul`,line:`Zum Hochzeitstag schenkst du mir eine Rose von der Tankstelle? Im Ernst?`,wisdom:`w_gaul`,concede:`Das Preisschild klebt noch dran, du Gaul.`,rebuttal:`Sie duftet nach Diesel, Denny.`},{id:`mina_sport`,line:`Zwei Jahre Fitnessstudio-Abo. Und wie oft warst du da? Einmal!`,wisdom:`w_sport`,concede:`Freispruch. Aus Mangel an Bewegung.`,rebuttal:`Und das eine Mal warst du nur duschen.`},{id:`mina_regen`,line:`Es schüttet wie aus Eimern, und du gehst ohne Schirm los?`,wisdom:`w_regen`,concede:`Dann bleib ruhig noch ein Stündchen draußen.`,rebuttal:`Du tropfst mir den ganzen Flur voll!`},{id:`mina_katze`,line:`Ich hab’s genau gesehen: Du bist wieder um den Lampenladen geschlichen!`,wisdom:`w_katze`,concede:`Miau. Na gut. Aber nur gucken, Kater.`,rebuttal:`Dein Nasenabdruck klebt noch an der Scheibe.`},{id:`mina_schreibt`,line:`Du führst Protokoll über unsere Streits? Mit Datum?!`,wisdom:`w_schreibt`,concede:`Dann trag ein: „14:32, Ehefrau lacht.“`,rebuttal:`Trag ein: „Schläft heute auf dem Sofa.“`},{id:`mina_kluegere`,line:`Kannst du nicht ein einziges Mal nachgeben? Ein Mal!`,wisdom:`w_kluegere`,concede:`Das ist das Ehrlichste, was du je gesagt hast.`,rebuttal:`Dann geb ich auch nicht nach. Viel Spaß.`},{id:`mina_vogel`,line:`Flohmarkt! Morgen um fünf! Der frühe Vogel fängt den Wurm, Denny!`,wisdom:`w_vogel`,concede:`Na gut, halb neun. Aber du trägst die Kisten.`,rebuttal:`Der Wecker steht jetzt auf halb fünf.`},{id:`mina_mutt`,line:`Du hast dich freiwillig für die Nachtschicht eingetragen. Muss das sein, Denny? Muss das?`,wisdom:`w_mutt`,concede:`Mutt dat? Na gut. Dat mutt wohl.`,rebuttal:`Nee, Denny. Dat mutt gar nix.`},{id:`mina_moin`,line:`Wir haben Besuch, und du begrüßt ihn mit „Moin“? Ein Wort? Mehr nicht?!`,wisdom:`w_moin`,concede:`Gut. Aber Tschüss sagst du nachher in ganzen Sätzen.`,rebuttal:`Die sind sechs Stunden gefahren, Denny. Sechs!`},{id:`mina_sturm`,line:`Draußen fliegen die Mülltonnen, und du willst an die Kiellinie? Das ist Sturm, Denny!`,wisdom:`w_sturm`,concede:`Du musst es wissen. Deine Locken sind schon lange weg.`,rebuttal:`Die Oslo-Fähre bleibt im Hafen, Denny. Die FÄHRE.`},{id:`mina_fisch`,line:`Du wolltest mehr Salat essen, Denny. Das da ist ein Fischbrötchen!`,wisdom:`w_fisch`,concede:`Ein Blatt. Na dann guten Appetit, du Kaninchen.`,rebuttal:`Das Blatt hast du rausgezupft. Ich hab’s gesehen.`}],excuses:[`Moin.`,`Äh ...`,`Das war schon so.`,`Das war ich nicht.`,`Guck mal, da hinten!`,`Ich hab gleich Dienst. Glaub ich.`,`Da kann ich gar nichts für.`,`Das wollte ich gerade machen!`,`Wie meinst du das jetzt?`,`Schumi hätte das auch so gemacht.`,`Das kam von ganz allein.`,`Ich liebe dich?`,`Die Katzen waren’s.`],winClosers:[`Hahaha! Na gut. Der Punkt geht an dich.`,`Wo hast du DEN denn her? Aus dem Heim?`,`Ich lach ja schon. Hau ab, du Kalenderblatt.`,`Unverschämt. Und leider gut.`,`Diesmal kommst du davon. Diesmal.`,`Okay, gewonnen. Bild dir bloß nichts drauf ein.`],loseClosers:[`Dachte ich mir. Wir sprechen uns noch.`,`Das war nichts, Schatz. Gar nichts.`,`Üb das noch mal. Am besten beim Müllrausbringen.`,`Schwach, Denny. Die Omas bringen dir mehr bei.`,`Damit ist das geklärt. Zu meinen Gunsten.`,`Netter Versuch. Nein.`],confiscate:[`{thing} kommt auf Kleinanzeigen. Keine Diskussion.`,`Der Haussegen hängt schief. {thing} hängt gleich im Internet.`,`Ich mach schon mal Fotos. Sag Tschüss zu: {thing}.`,`{thing} zieht aus. Du darfst winken.`,`Es reicht. {thing} sucht ein neues Zuhause.`],pleased:[`Na guck, er kann ja!`,`So gefällst du mir. Weitermachen!`,`Oh, fleißig heute! Ich bin fast gerührt.`,`Sehr schön. Ich hab nichts gesehen. Nur Gutes.`,`Mein Held des Haushalts.`,`Brav. Dafür gibt’s später was Feines.`],lunchbox:[`Deine Brotdose. Ohne Erdnuss, ohne Sesam, mit Liebe.`,`Hab dir was eingepackt. Sesamfrei. Ich hab zweimal geguckt.`,`Hier, für die Nacht. Teil es nicht mit Gerda.`,`Nimm das mit. Und komm heil wieder, du Lampenheini.`,`Iss es, bevor deine Schwester es findet.`],waveOff:[`Ich hab’s verstanden, Denny.`,`Schon gut. Einmal am Tag reicht mir.`,`Nein. Heute kein Spruch mehr. Weitergehen.`,`Ich sag nichts, du sagst nichts. So gewinnen alle.`,`Du hattest heute schon recht. Übertreib es nicht.`,`Heute warst du schon dran. Morgen wieder.`]},Jh={mdk:{id:`mdk`,name:`Der MDK-Prüfer`,title:`Unangekündigte Qualitätsprüfung`,intro:[`Unangekündigte Prüfung! Angekündigt wurde sie nur dem Träger.`,`Behebe jeden Mangel, bevor er ihn sieht.`,`Er sieht weit. Und er hat ein Klemmbrett.`],barks:[`Mangel festgestellt!`,`Das wird vermerkt.`,`Aha. Aha. Soso.`,`Wo ist hierfür der Nachweis?`,`Ziffer 4.3, Absatz 2!`,`Bitte dreifach ausfertigen.`],duelOpener:`Kommen wir zur mündlichen Anhörung gemäß Prüfkatalog, Abschnitt 9.`,lines:[{id:`mdk_schreibt`,line:`Gemäß Anlage 7b ist die Dokumentation der Dokumentation zu dokumentieren. Wo ist sie?`,wisdom:`w_schreibt`,concede:`Sitzend erbracht. Das ist ... zulässig. Vermerkt.`,rebuttal:`Nicht dokumentiert heißt: nicht geschehen.`},{id:`mdk_nichts`,line:`Laut Soll-Ist-Abgleich der Personalausstattung beträgt das Ist hier: nichts.`,wisdom:`w_nichts`,concede:`Reichlich nichts. Das erfüllt formal die Quote.`,rebuttal:`„Nichts“ ist keine anrechenbare Fachkraft.`},{id:`mdk_uhr`,line:`Die Tablettengabe für 22:00 Uhr erfolgte laut Protokoll um 22:07 Uhr. Stellungnahme?`,wisdom:`w_uhr`,concede:`Abweichung durch höhere Gewalt. Kästchen 12.`,rebuttal:`Sieben Minuten. Das gibt eine Feststellung.`},{id:`mdk_ordnung`,line:`Die Ablagestruktur Ihres Dienstzimmers entspricht keiner mir bekannten Verordnung.`,wisdom:`w_ordnung`,concede:`Für die andere Hälfte bin ich nicht zuständig.`,rebuttal:`Unordnung ist ein Mangel nach Ziffer 4.3.`},{id:`mdk_steht`,line:`Der Pflegewagen in Flur B steht laut Begehung seit drei Tagen unbewegt. Wie lange noch?`,wisdom:`w_steht`,concede:`Bestandsschutz. Dagegen bin ich machtlos.`,rebuttal:`Abstellen ist genehmigungspflichtig.`},{id:`mdk_uebrig`,line:`Von 40 Formularen wurden 39 ausgefüllt. Eines ist übrig. Erklären Sie das!`,wisdom:`w_uebrig`,concede:`Ein Formular zu viel? Das ... prüfe ich intern.`,rebuttal:`Für übrige Formulare gibt es Formular 41.`},{id:`mdk_hoeren`,line:`Haben Sie meine Belehrung nach Paragraf 114 akustisch zur Kenntnis genommen?`,wisdom:`w_hoeren`,concede:`Ruhe ist nicht prüfungsrelevant. Leider.`,rebuttal:`Dann wiederhole ich die Belehrung. Vollständig.`},{id:`mdk_lohn`,line:`Ihre Mehrarbeit wird mit ideeller Anerkennung vergütet. Wo bleibt Ihr Dank?`,wisdom:`w_lohn`,concede:`Brutto wie netto null. Rechnerisch korrekt.`,rebuttal:`Applaus ist steuerfrei. Seien Sie dankbar.`}],themes:`Doku, Personal, Uhr, Ordnung, Abstellen, Reste, Hören, Dank`,defeated:`Ergebnis: Note 1,0. Ich finde hier nichts. Das ist mir noch nie passiert.`,victorious:`Der Mängelbericht folgt. Vierzig Seiten. Zuzüglich Anlagen.`},baerbel:{id:`baerbel`,name:`Bingo-Bärbel`,title:`Die Stimme des Bingo-Abends`,intro:[`Bingo-Abend! Der Saal ist voll, Bärbel hat das Mikro.`,`Bring ihr jede gezogene Kugel, bevor ihre Geduld reißt.`,`Sonst stürmt das Publikum die Flure.`],barks:[`Die nächste Zahl, meine Lieben!`,`Wo bleibt meine Kugel, Schätzchen?`,`Trommelwirbel, bitte!`,`Das Publikum wird unruhig!`,`Zack, zack, Herzchen!`,`Und weiter geht die wilde Fahrt!`],duelOpener:`Und jetzt, meine Damen und Herren: das große Finale! Ich gegen den Pfleger!`,lines:[{id:`baerbel_scherben`,line:`Ups! Der Hauptpreis, die gute Vase: tausend Scherben! Was sagen wir dazu, Schätzchen?`,wisdom:`w_scherben`,concede:`Applaus! Der Mann nimmt die Scherben mit!`,rebuttal:`Falsch! Dein Trostpreis ist ein Kehrblech!`},{id:`baerbel_gaul`,line:`Der Hauptgewinn: ein Paar Topflappen, leicht schief gehäkelt! Geschenkt! Na, enttäuscht?`,wisdom:`w_gaul`,concede:`So ist’s recht! Bescheidenheit, meine Damen!`,rebuttal:`Banause! Die hat Frau Schulte selbst gehäkelt!`},{id:`baerbel_alt`,line:`Meine Damen und Herren: der Jüngste im Saal! Und schnauft wie der Älteste! Na?`,wisdom:`w_alt`,concede:`Hundertvier! Dann gehört er ja zu uns! Tusch!`,rebuttal:`Na, na! Mit hundertvier wird hier noch getanzt!`},{id:`baerbel_kluegere`,line:`Bei mir gibt’s keine Widerworte, Herzchen! Gibst du freiwillig nach?`,wisdom:`w_kluegere`,concede:`Ha! Dumm, aber standhaft! Das Publikum tobt!`,rebuttal:`Das war kein Nein! Das zählt als Aufgabe!`},{id:`baerbel_reden`,line:`Na, Herzchen, hat’s dir die Sprache verschlagen? Sag was Nettes ins Mikro!`,wisdom:`w_reden`,concede:`Silber! Zweiter Platz! Immerhin, Herzchen!`,rebuttal:`Lauter! Reihe sieben hat das Hörgerät aus!`},{id:`baerbel_trinken`,line:`Die Eierlikör-Runde geht aufs Haus! Was sagt denn unser Pfleger dazu, hm?`,wisdom:`w_trinken`,concede:`Der Mann versteht was von Medizin! Prost!`,rebuttal:`Spielverderber! Für dich gibt’s Kamillentee!`},{id:`baerbel_bremst`,line:`12! 67! 3! 41! Zu schnell, Schätzchen? Soll ich mal auf die Bremse treten?`,wisdom:`w_bremst`,concede:`Ein Rennfahrer! Dann eben Vollgas, Herzchen!`,rebuttal:`Zu langsam! Die 41 ist längst durch!`},{id:`baerbel_katze`,line:`Drei Kugeln weg! Und Frau Schulte sitzt da wie die Katze vorm Mauseloch! Na, Schätzchen?`,wisdom:`w_katze`,concede:`Und der Kater bringt sie brav zurück! Bravo!`,rebuttal:`Falsch! Und jetzt such die 17, die fehlt!`}],themes:`Scherben, Gaul, Alter, Nachgeben, Reden, Likör, Tempo, Katze`,defeated:`Bingo für den jungen Mann! Ich verneige mich. Aber nur ganz leicht.`,victorious:`Und der Verlierer des Abends steht fest! Applaus, er hat ja sonst nichts!`},angeh:{id:`angeh`,name:`Die Angehörigen`,title:`Besuchszeit. Um 23 Uhr.`,intro:[`Die Angehörigen sind da. Alle. Gleichzeitig. Nachts.`,`Jeder will etwas. Bring es ihnen, bevor sie dich einholen.`,`Sie haben Zeit, Meinungen und Internet.`],barks:[`Ich will die Leitung sprechen!`,`Das kommt in die Bewertung!`,`Ein Stern! Ein einziger!`,`Wir zahlen hier schließlich dafür!`,`Ich kenne jemanden bei der Zeitung!`,`Hallo? Hier wartet jemand!`],duelOpener:`So. Und jetzt hätten wir da noch ein paar Punkte. Wir haben eine Liste.`,lines:[{id:`angeh_junge`,line:`Sie essen im Dienst ein Brötchen? Während meine Tante wartet? Ein Stern!`,wisdom:`w_junge`,concede:`Das ... sagt meine Tante auch immer. Zwei Sterne.`,rebuttal:`Unverschämt! Ich mache ein Foto vom Brötchen!`},{id:`angeh_regen`,line:`Mein Vater saß bei Nieselregen auf dem Balkon! Das kommt ins Internet!`,wisdom:`w_regen`,concede:`Er sah tatsächlich erholt aus. Na gut.`,rebuttal:`Schön?! Er war nass! Ein Stern!`},{id:`angeh_kleider`,line:`Blaue Turnschuhe im Dienst? Ist das hier ein Pflegeheim oder eine Disco?`,wisdom:`w_kleider`,concede:`Schnell sind Sie ja. Das muss ich zugeben.`,rebuttal:`Unprofessionell! Das erwähne ich namentlich!`},{id:`angeh_vogel`,line:`Ich war in aller Herrgottsfrühe hier, vor allen anderen! Und die Tür war zu!`,wisdom:`w_vogel`,concede:`So hat noch keiner mit mir geredet. Respekt.`,rebuttal:`Morgen komme ich um fünf. Mit Checkliste.`},{id:`angeh_weg`,line:`Die Beschilderung ist eine Zumutung! Ich habe zwanzig Minuten Zimmer 12 gesucht!`,wisdom:`w_weg`,concede:`Ich habe mich nicht verlaufen. Ich habe erkundet.`,rebuttal:`Ich verlange einen Lageplan! Laminiert!`},{id:`angeh_probieren`,line:`Haben Sie den Kartoffelbrei etwa selbst probiert, bevor Onkel Horst ihn bekam?`,wisdom:`w_probieren`,concede:`Und, war er warm? ... Gut. Weitermachen.`,rebuttal:`Vom Teller meines Onkels! Das wird gemeldet!`},{id:`angeh_licht`,line:`In Omas Zimmer brennt die ganze Nacht ein Licht! Wer bezahlt das eigentlich?`,wisdom:`w_licht`,concede:`Omas Zehen sind mir heilig. Lassen Sie es an.`,rebuttal:`Verschwendung! Das rechne ich der Leitung vor!`},{id:`angeh_vorrat`,line:`Warum stapeln sich in Opas Schrank vierzig Dosen Pfirsiche? Wozu denn das?`,wisdom:`w_vorrat`,concede:`Na gut. Aber ich zähle nach. Jede einzelne Dose.`,rebuttal:`Vierzig Dosen! Das melde ich der Heimaufsicht!`}],themes:`Essen, Regen, Schuhe, Vögel, Wege, Probieren, Licht, Vorrat`,defeated:`Na gut. Fünf Sterne. Aber wir kommen nächsten Sonntag wieder. Alle.`,victorious:`Ein Stern. Und der ist für den Parkplatz.`}},W={schlurf:{id:`schlurf`,name:`Herr Schlurf`,file:`Schlurft langsam, kommt aber immer an. Hat zu allem eine Geschichte. Meist dieselbe.`,intro:`Herr Schlurf: langsam, kennt aber jede Abkürzung.`,voice:`schlurf`,barks:[`Junger Mann!`,`Warten Sie mal!`,`Da sind Sie ja!`,`Nur ganz kurz!`,`Ich hab da eine Frage!`,`Nicht so schnell!`],openers:[`Junger Mann, hab ich Ihnen schon vom Winter 62 erzählt? Nein? Setzen Sie sich.`,`Die Kugel Eis kostete mal zehn Pfennig. Zehn! Und die war größer als heute.`,`Ich war dreißig Jahre bei der Post. Fragen Sie mich was über Briefmarken!`,`Mein erster Wagen war ein Käfer. Den hab ich jeden Morgen selbst angeschoben.`,`Müde? Wir haben sechzehn Stunden gearbeitet. Und danach noch getanzt!`,`Kennen Sie den Unterschied zwischen Brief und Einschreiben? Ich erklär’s Ihnen.`,`Haben Sie zwei Minuten? Es dauert höchstens eine Stunde.`],confused:[`Fernsehen? Moment ... läuft jetzt nicht die Tagesschau? Ich muss los!`,`Ach du liebe Zeit, mein Quiz! Wo ist die Fernbedienung?`,`Das Programm! Wo hab ich die Zeitschrift? Entschuldigen Sie mich.`,`Welcher Sender war das noch? Das Dritte? Das muss ich nachgucken.`],delighted:[`Früher! Sehen Sie, DAS ist ein Thema. Also, 1958 ...`,`Endlich fragt mal einer! Holen Sie sich einen Stuhl.`,`Ja, früher! Da fang ich am besten ganz vorne an.`,`Das interessiert Sie? Dann erzähl ich die lange Fassung.`],neutral:[`Mag sein, mag sein. Wo war ich stehen geblieben?`,`Soso. Aber das wollte ich gar nicht erzählen.`,`Wie bitte? Na, egal. Jedenfalls ...`,`Hm. Das erinnert mich an etwas ganz anderes.`],teach:[`Na gut, junger Mann. Aber merken Sie sich eins:`,`Ich muss weiter. Aber einen Rat geb ich Ihnen mit:`,`Sie haben’s eilig, was? Dann nur noch das hier:`,`Schon gut, schon gut. Mein Großvater sagte immer:`]},rita:{id:`rita`,name:`Rollator-Rita`,file:`Von null auf hundert in einem Flur. Bremsen sind was für Leute mit Zeit.`,intro:`Rollator-Rita: auf Geraden schnell, an Ecken ratlos.`,voice:`rita`,barks:[`Bahn frei!`,`Achtung, ich komme!`,`Huhu, Herr Pfleger!`,`Platz da!`,`Stehen bleiben!`,`Ich hab Vorfahrt!`],openers:[`Herr Pfleger! Meine Tomaten waren 1983 die größten im ganzen Kleingartenverein!`,`Wissen Sie, was die Neue aus der 9 gesagt hat? Halten Sie sich fest. Am Rollator.`,`Ich hab den Rollator tiefergelegt. Gucken Sie mal. Nein, richtig gucken!`,`Gut, dass ich Sie erwische! Ich hab extra Anlauf genommen.`,`Die Frau Schulte aus der 14 schummelt beim Bingo. Ich hab Beweise.`,`Ich bin mal Motorroller gefahren. Der hier ist langsamer, hat aber einen Korb.`,`Sie rennen ja immer so! Bleiben Sie mal stehen, ich muss Ihnen was erzählen.`],confused:[`Schlager? Hmm-hmm-hmmm ... Griechischer Wein ... Wo wollte ich hin?`,`Oh! Lalala, la-la ... Das ist mein Lied! Ich roll mal weiter.`,`Marmor, Stein und Eisen ... dam dam, dam dam ... Tschüssi!`,`Ach, die Melodie! Hmmm-hmm ... Die krieg ich jetzt nicht mehr raus.`],delighted:[`Garten! Also, meine Tomaten, die hab ich immer mit Kaffeesatz ...`,`Sie gärtnern? Dann erzähl ich Ihnen alles über Schnecken. Alles.`,`Der Garten! Kommen Sie, ich zeig Ihnen die Geranien. Alle vierzig.`,`Ach, Rhabarber! Dafür hab ich Zeit. Und Sie jetzt auch.`],neutral:[`Jaja. Aber jetzt hören Sie mal zu.`,`Das ist ja schön für Sie. Also, wie gesagt ...`,`Papperlapapp. Wo war ich?`,`Kann sein. Aber das Wichtigste kommt ja noch!`],teach:[`Ich muss weiter, der Flur ist frei! Aber merken Sie sich:`,`Na schön. Im Kleingartenverein hieß es immer:`,`Sie sind mir einer. Hier, zum Mitnehmen:`,`Ich hab’s eilig. Nur noch schnell eine Lebensweisheit:`]},rudi:{id:`rudi`,name:`Rollstuhl-Rudi`,file:`Fährt Ideallinie, trifft aber selten die Kurve. Hält sich für den Schumi von Station 3.`,intro:`Rollstuhl-Rudi: schnell, aber die Kurve kriegt er nie.`,voice:`rudi`,barks:[`Platz da, ich hab DRS!`,`Blaue Flagge!`,`Aus der Ideallinie!`,`Ich komm innen durch!`,`Bremsen? Welche Bremsen?`,`Letzte Runde!`],openers:[`Halt! Boxenstopp! Ich muss Ihnen von Spa 1998 erzählen. Runde für Runde.`,`Wissen Sie, wie schnell ich in Flur B war? Ich auch nicht. Aber es war Rekord.`,`Der Schumacher und ich, wir haben denselben Fahrstil. Nur er hatte Bremsen.`,`Hören Sie den Reifen? Vorne links. Das ist ein Bremsplatten. Ich erklär’s Ihnen.`,`Ich bin mal Manta gefahren. Mit Fuchsschwanz. Setzen Sie sich, es wird lang.`,`Die Kurve am Schwesternzimmer nehm ich voll. Wollen Sie wissen, wie? Im Detail?`,`Safety-Car-Phase! Solange Sie stehen, erläutere ich Ihnen meine Strategie.`],confused:[`Regen?! Box, Box! Ich brauch die Regenreifen!`,`Was, es wird nass? Box, Box, Box! Reifenwechsel!`,`Wetterumschwung! Sofort an die Box! Wo ist meine Crew?`,`Schauer in Sektor zwei? Box, Box! Die Intermediates!`],delighted:[`Formel 1! Ein Mann von Welt. Also: Suzuka, 2000 ...`,`Schumi! Sagen Sie das doch gleich! Ich kenn alle sieben Titel auswendig.`,`Ein Fan! Dann gehen wir jetzt jedes Rennen einzeln durch.`,`Endlich einer mit Benzin im Blut! Parken Sie, das dauert.`],neutral:[`Jaja. Zurück zum Rennen.`,`Uninteressant. Wo war ich? Ach ja, Runde zwölf.`,`Das bringt keine Zehntel. Also, wie gesagt ...`,`Hm. Der Funk war gestört. Ich wiederhole.`],teach:[`Zielflagge für Sie. Aber eine Stallorder kriegen Sie noch:`,`Gutes Rennen, Junge. Mein alter Mechaniker sagte immer:`,`Ich muss zurück auf die Strecke. Merken Sie sich das:`,`Sie haben mich ausgebremst. Respekt. Hier, fürs Leben:`]},keksoma:{id:`keksoma`,name:`Keks-Oma Gerda`,file:`Backt für die ganze Station. Immer mit Sesam. Sie meint es wirklich nur gut.`,intro:`Keks-Oma Gerda: Abstand! Der Sesam liegt in der Luft.`,voice:`keksoma`,barks:[`Jungchen, ein Keks!`,`Sie sind ja viel zu dünn!`,`Nehmen Sie doch einen!`,`Frisch gebacken!`,`Nur ein Kekschen!`,`Mit extra viel Sesam!`],openers:[`Jungchen, Sie essen ja gar nichts! Hier, die sind mit Sesam. Sesam ist gesund.`,`Das Rezept ist von meiner Großtante. Streng geheim. Na gut: Es ist Sesam.`,`Sie fallen mir ja vom Fleisch! Einen Keks. Oder vier. Ich zähle mit.`,`Allergie? Ach was, das wächst sich raus. Probieren Sie mal.`,`Ich hab heute drei Bleche gemacht. Zwei sind für Sie. Keine Widerrede.`,`Der Doktor sagt, ich soll nicht so viel backen. Der Doktor ist auch zu dünn.`,`Kommen Sie, kommen Sie! Der Teller ist noch warm. Nur ein Häppchen.`],confused:[`Enkel? Ach, der Kevin! Moment, ich hol die Fotos. Wo ist meine Tasche?`,`Die Kleine hat jetzt eine Zahnspange! Ich hab ein Bild ... irgendwo ... Moment.`,`Mein Enkel studiert! Irgendwas mit Medien. Die Fotos sind im Zimmer!`,`Oh, die Fotos! Das Album liegt auf dem Nachttisch. Laufen Sie nicht weg!`],delighted:[`Kuchen? Sie mögen Kuchen?! Dann kriegen Sie gleich ein ganzes Blech!`,`Ach, ein Kenner! Hier, probieren Sie. Und den hier. Und den.`,`Backen ist mein Leben! Setzen Sie sich, ich diktier Ihnen das Rezept.`,`Kuchen! Endlich redet mal einer vernünftig. Mund auf, Jungchen.`],neutral:[`Jaja, Jungchen. Aber erst wird gegessen.`,`Das ist ja interessant. Nehmen Sie trotzdem einen Keks.`,`Hm? Reden Sie nicht so viel, kauen Sie lieber.`,`Schön, schön. Davon wird der Teller nicht leerer.`],teach:[`Na gut, dann eben kein Keks. Aber das hier nehmen Sie mit:`,`Sie Sturkopf. Meine Großtante hat immer gesagt:`,`Ich pack Ihnen welche ein. Und einen Spruch dazu:`,`Dann eben nicht. Aber hören Sie auf eine alte Frau:`]},schlafwandler:{id:`schlafwandler`,name:`Der Schlafwandler`,file:`Dreht nachts seine Runden und träumt vom Busfahren. Bitte nicht wecken. Wirklich nicht.`,intro:`Der Schlafwandler: tut nichts. Nur nicht anrempeln.`,voice:`schlafwandler`,barks:[`Zzz ... Fahrkarten, bitte ...`,`Zzz ... zwei Stück Zucker ...`,`Mmh ... der Bus kommt gleich ...`,`Zzz ... nein, Hilde, links rum ...`,`Chrrr ... noch fünf Minuten ...`,`Zzz ... Endstation ... alle aussteigen ...`,`Mmmh ... ich hab doch gestempelt ...`,`Zzz ... wer hat die Kartoffeln ...`],openers:[`WAS? WER? WO? ACH, DER PFLEGER! HALLO, HERR PFLEGER!`,`HUCH! ICH BIN WACH! ALLE MAL HERKOMMEN!`,`IST SCHON FRÜHSTÜCK? FRÜHSTÜCK! DER PFLEGER IST DA!`],confused:[`Wo bin ich? Ach so. Gute Nacht.`,`Falsche Haltestelle ... zzz ...`],delighted:[`Schön, schön ... zzz ...`,`Bitte einsteigen ... chrrr ...`],neutral:[`Hm? Zzz ...`,`Mmh ... ja, ja ...`],teach:[`Im Traum hat mir einer gesagt:`,`Zzz ... und merken Sie sich ...`]},petersen:{id:`petersen`,name:`Frau Petersen`,file:`Liebt Zimmerpflanzen von Herzen. Denny führt seitdem eine Bestandsliste. Sie wird kürzer.`,intro:`Frau Petersen: will nur zu den Pflanzen. Schenkt ein Blatt.`,voice:`petersen`,barks:[`Mmh. Die Grünlilie ist heute zart.`,`Ach, der Ficus. Ein feiner Jahrgang.`,`Nur noch ein Blättchen.`,`Guten Abend, Herr Pfleger!`,`Die Yucca heb ich mir für Sonntag auf.`,`Hach, wie schön grün hier.`,`Der Gummibaum ist was für Kenner.`,`Ganz frisch gegossen. Das schmeckt man.`],openers:[`Oh, Herr Pfleger! Sie kommen gerade recht.`,`Schauen Sie mal, wie der Farn heute steht!`],confused:[`Ach so? Na, dann geh ich mal zum Ficus.`,`Wie schön. Ich muss weiter, die Palme wartet.`],delighted:[`Ach, wie nett! Das merk ich mir.`,`Sie sind ein Guter. Hach.`],neutral:[`Ja, ja. Schön grün, nicht?`,`Mhm. Sehr bekömmlich.`],teach:[`Meine Rede seit jeher, junger Mann:`,`Das stand mal auf einem Blumentopf:`]},hinnerk:{id:`hinnerk`,name:`Käpt’n Hinnerk`,file:`Kapitän a. D. Hält im Flur Ausguck. Dreimal um die Welt, einmal davon versehentlich.`,intro:`Käpt’n Hinnerk: sieht auf Geraden bis zum Horizont. Bieg ab.`,voice:`hinnerk`,barks:[`Ahoi!`,`Pfleger voraus!`,`Ich seh dich, min Jung!`,`Beidrehen!`,`Mann auf dem Flur!`,`Alle Mann an Deck!`],openers:[`Ahoi, min Jung! Hab ich dir schon von Kap Hoorn erzählt? Windstärke zwölf. Mindestens.`,`Der Hering damals vor Island war so lang wie dieser Flur. Und das war der kleine.`,`Ich hab die Oslo-Fähre mal rückwärts eingeparkt. Bei Nebel. Mit einer Hand am Kaffee.`,`Den Äquator hab ich elfmal überquert, min Jung. Zweimal davon zu Fuß. Setz dich.`,`Flur B ist bei Nacht tückischer als die Biskaya. Ich hab beide befahren. Hör zu.`,`Siehst du den Feuerlöscher da? Genau so rot war der Klabautermann. Ungelogen.`,`Die Kieler Woche 72 hab ich gewonnen. Ich war gar nicht gemeldet. Aber gewonnen.`,`Windstärke elf, und an Bord nur noch eine Dose Labskaus. Das war ein Dienstag.`],confused:[`Garten? An Land? Da schwankt ja nichts, Jung. Mir wird ganz anders.`,`Tomaten? Welchen Tiefgang hat denn so eine Tomate? Ich muss in die Seekarte gucken.`,`Ein Beet. Mit Erde. Fester Boden ist nichts für mich, min Jung. Ich dreh ab.`,`Rasenmähen steht in keinem Logbuch. Ich geh mal peilen, wo ich bin.`],delighted:[`Seefahrt! Setz dich, min Jung, das dauert drei Glasen. Mindestens.`,`Na endlich ein Seemann! Also, Kap Hoorn. Die ganze Geschichte, von der Werft an.`,`Dat hör ich gern! Hol dir einen Stuhl und mach ihn fest. Es wird stürmisch.`,`Ein Mann vom Fach! Dann zeig ich dir jetzt alle Knoten. Es sind zweiundvierzig.`],neutral:[`Jo. Wo war ich? Ach ja: Eisberg an Backbord.`,`Mag sein, min Jung. Aber hör dir erst das Ende an.`,`Nu man sinnig. Die Geschichte ist noch nicht im Hafen.`,`Dat is Landrattenschnack. Also, weiter im Text.`],teach:[`Na gut, min Jung, leg ab. Aber merk dir eins:`,`Du hast mich vom Kurs gebracht. Respekt. Hier, fürs Logbuch:`,`Ich muss zurück auf den Ausguck. Mein alter Steuermann sagte immer:`,`Klar zur Wende, Jung. Einen Spruch geb ich dir mit auf die Reise:`]}},Yh={wetter:{id:`wetter`,name:`Wetter`,lines:[`Apropos: Soll es morgen nicht regnen?`,`Huch, ist das da draußen etwa Nebel?`,`Ganz schön frisch für die Jahreszeit, oder?`,`Mein Knie sagt: Gewitter. Was sagt Ihres?`,`Haben Sie die Wolke gesehen? Die sah aus wie ein Drache.`,`Morgen dreißig Grad! Oder drei. Ich hab nur halb zugehört.`,`Riechen Sie das? Das riecht nach Schnee.`,`Der Wetterbericht hat übrigens gelogen. Schon wieder.`]},schlager:{id:`schlager`,name:`Schlager`,lines:[`Sagen Sie mal: Wie ging noch „Griechischer Wein“?`,`Ist Helene Fischer eigentlich wirklich atemlos?`,`Roland Kaiser: Genie oder nur gut frisiert?`,`Kennen Sie das? Dam dam, dam dam ... Wie heißt das?`,`Ich glaub, im Radio läuft gerade Ihr Lied!`,`Wer war besser: Udo Jürgens oder Udo Jürgens?`,`Warum heißt es Schlager? Wer wird da geschlagen?`,`Mit 66 Jahren fängt was an? Ich vergess das immer.`]},formel1:{id:`formel1`,name:`Formel 1`,lines:[`Hand aufs Herz: Hat Schumi 2006 in Monaco nur geparkt?`,`Was halten Sie eigentlich von Ein-Stopp-Strategien?`,`Weich oder hart? Die Reifen, meine ich.`,`Wussten Sie, dass ein Boxenstopp zwei Sekunden dauert?`,`Sieben Titel! Sieben! Wollen wir kurz darüber reden?`,`Ich sag nur: Spa. 1998. Dreizehn Autos.`,`Finden Sie nicht auch, dass rote Autos schneller sind?`,`Ganz ehrlich: Zwölf Zylinder klingen einfach schöner.`]},enkel:{id:`enkel`,name:`Enkel`,lines:[`Wie geht’s eigentlich Ihren Enkeln?`,`Hat Ihr Enkel nicht bald Geburtstag?`,`Was macht Ihr Enkel noch mal beruflich?`,`Die kleine Enkelin müsste doch längst laufen, oder?`,`Haben Sie neue Fotos von den Enkeln? Rein interessehalber.`,`Wann waren die Enkel noch mal zu Besuch? Sonntag?`,`Ihr Enkel sieht Ihnen bestimmt ähnlich. Stimmt’s?`,`Was wünscht sich so ein Enkel heute zu Weihnachten?`]},garten:{id:`garten`,name:`Garten`,lines:[`Sagen Sie: Wann schneidet man eigentlich Rosen?`,`Meine Tomaten werden nichts. Was mach ich falsch?`,`Was hilft gegen Schnecken? Es eilt.`,`Ist Rhabarber Obst oder Gemüse? Ich frag für einen Freund.`,`Haben Sie die Geranien im Hof gesehen? Skandalös.`,`Gartenzwerge: ja oder nein?`,`Ich will eine Hecke pflanzen. Thuja oder Liguster?`,`Wussten Sie, dass Maulwürfe unter Naturschutz stehen?`]},fernsehen:{id:`fernsehen`,name:`Fernsehen`,lines:[`Moment, kommt jetzt nicht gleich die Tagesschau?`,`Haben Sie gestern den Tatort gesehen? Wer war’s?`,`Läuft heute nicht Ihr Quiz? Auf welchem Sender?`,`Wo ist eigentlich die Fernbedienung hin?`,`Wie viele Programme braucht ein Mensch? Drei?`,`Ich glaub, im Ersten kommt gerade was mit Tieren.`,`Was ist aus dem Testbild geworden? Weiß das einer?`,`Wird „Wetten, dass ..?“ eigentlich noch mal wiederholt?`]},kuchen:{id:`kuchen`,name:`Kuchen`,lines:[`Kurze Frage: Streusel oben oder unten?`,`Was gehört in einen echten Käsekuchen? Rosinen?`,`Ist Donauwelle ein Kuchen oder ein Gewässer?`,`Backen Sie mit Butter oder mit Überzeugung?`,`Frankfurter Kranz. Ihre Meinung. Jetzt.`,`Ich hab gehört, es gibt heute Bienenstich!`,`Torte mit Sahne oder ohne? Das ist hier die Frage.`,`Wie lange muss ein Hefeteig eigentlich gehen?`]},frueher:{id:`frueher`,name:`Früher`,lines:[`War früher eigentlich wirklich alles besser?`,`Was hat früher so ein Brötchen gekostet?`,`Wie war das früher, so ganz ohne Handy?`,`Erzählen Sie mal: Wie wurde früher getanzt?`,`Gab es früher auch schon Montage?`,`Stimmt es, dass früher mehr Lametta war?`,`Wie kam man früher ohne Navi irgendwo an?`,`Was fuhr man früher so? nz kurz. Zzz.`,`Akku leer. Das sieht der Dienstplan nicht vor.`,`Umgekippt. Herr Schlurf deckt ihn zu und erzählt weiter.`,`Feierabend durch technischen K. o.`,`Die Station dankt für Ihren Einsatz. Mit Applaus.`,`Ausfall wegen Überstunden. Bitte Formular 12b ausfüllen.`],gameOverAllergy:[`Sesam: 1. Denny: 0.`,`Kopf wie ein Heißluftballon. Schicht beendet.`,`„Es war doch nur EIN Keks“, sagt Gerda.`,`Kein EpiPen dabei. Das Shirt hatte gewarnt.`,`Denny schwillt an. Der Abend ab.`,`„Kann Spuren von Erdnüssen enthalten.“ Konnte es. Tat es.`],listings:[`{thing}, kaum gebraucht. Mein Mann hängt dran, ich nicht. 15 € VB.`,`Verkaufe {thing}. Nur Abholung. Bitte kommen, wenn mein Mann Dienst hat.`,`{thing} zu verschenken. Ernsthaft. Nehmt es einfach mit.`,`{thing}, top Zustand, Nichtraucherhaushalt, ein Drachenfreund. 12 € VB.`,`Suche Platz im Wohnzimmer, biete {thing}. Tausch gegen nichts möglich.`,`{thing} abzugeben. Keine Rücknahme. Schon gar nicht an Denny.`,`{thing} an Selbstabholer. Der Vorbesitzer weint, bitte ignorieren.`,`Notverkauf: {thing}. Grund: Es reicht. Preis: egal.`,`{thing}, an Bastler. Macht kein Licht, aber zuverlässig Ärger.`],kumpelGreet:[`Psst! Denny! Für den Sohn von meinem besten Kumpel: Sonderpreis.`,`Alles original. Original was, klären wir später.`,`Dein Vater und ich, wir haben Dinger gedreht ... Na, kauf erst mal was.`,`Guck in den Mantel. Links Technik, rechts Feinkost.`,`Na, Kleiner? Groß bist du geworden. Und oben rum kahl. Ganz der Papa.`,`Ist nicht vom Laster gefallen. Der Laster ist gefallen. Großer Unterschied.`],kumpelSold:[`Gute Wahl. Quittung gibt’s keine, Garantie auch nicht. Aber Liebe.`,`Verkauft! Und wenn einer fragt: Du kennst mich nicht.`,`Hält ewig. Oder bis Donnerstag. Eins von beiden.`,`Grüß deinen Vater. Sag ihm, das mit dem Anhänger tut mir leid.`,`Schönes Stück. Hat vorher einem sehr netten Menschen gehört.`],kumpelBroke:[`Kein Geld? Stimmt ja, du arbeitest in der Pflege. Mein Fehler.`,`Anschreiben geht nicht mehr. Seit der oxenstopp.`,`Rita nimmt Anlauf und fährt stur geradeaus. Ein Schritt zur Seite genügt.`,`Rudi verpasst jede Kurve. Schlag Haken, den Rest erledigt die Wand.`,`Nach sechs Uhr läuft die Schicht weiter. Das Gehalt nicht.`,`Die Schwester findet alles. Auch neutral Verpacktes.`,`Jeder Bewohner hat ein Thema, das ihn aus dem Konzept bringt.`,`Was nicht dokumentiert ist, ist nie passiert. Auch deine Pause.`,`Applaus hat null Kalorien und null Euro.`,`Hängt der Haussegen schief, landet etwas auf Kleinanzeigen.`,`Die Schicht allein macht schon müde. Wie müde, steht im Personalschlüssel.`,`Beim Plaudern läuft die Uhr weiter. Herr Schlurf hat Zeit. Du nicht.`,`Verloren, weil dir der Spruch fehlte? Jetzt kennst du ihn. Das nennt man Lehrgeld.`,`Ausreden sind als Ausreden markiert. Mina erkennt sie auch ohne Markierung.`,`Die Taschen sind begrenzt. Pro Beförderung gibt es eine mehr. Das ist die Gehaltserhöhung.`,`Ein gewonnenes Wortgefecht am Tag zählt. Danach winkt Mina nur noch ab.`,`Die Kaputte flackert, aber neben ihr schläft es sich besser. Mina nimmt sie zuerst.`,`Eine Schwäche findet man nur durch Ausprobieren. Dafür bleibt sie in der Akte.`,`Sprinten kostet ${$h(V.player.sprintCost)} Energie die Sekunde. Schumi hatte eine Box. Du hast einen Kaffeeautomaten.`,`In Kiel klaut nicht die Schwester. In Kiel klaut die Möwe.`,`Schatten am Boden, Schrei von oben: unterstellen oder rennen.`,`Am Kai schiebt der Wind. In Kiel heißt das: windstill.`,`Am Fischbrötchenstand gibt es Energie. Einmal. Der Rest ist für die Möwen.`,`Käpt’n Hinnerk sieht auf Geraden bis zum Horizont. Ecken sind dein Hafen.`,`Schietwetter gibt es nicht. Es gibt nur Pfützen und Leute ohne Regenreifen.`,`Pflanzenbestand Station 3: Soll 12, Ist 9. Ursache: wird geprüft.`,`Jede Topfpflanze, die morgens noch steht, zählt als Überstunde.`,`Nachbestellung Grünlilie, die vierte. Begründung laut Formular: „natürlicher Schwund“.`,`Der MDK wertet jede angeknabberte Pflanze als Mangel. Frau Petersen als Empfehlung.`],nig
